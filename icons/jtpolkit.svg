<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B25C"/>
      <stop offset="1" stop-color="#CE8A2F"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="112" fill="url(#glow)"/>
  <circle cx="128" cy="126" r="98" fill="url(#disc)" stroke="#404040" stroke-width="2"/>

  <!-- shackle -->
  <path d="M 90 112 A 38 38 0 0 1 166 112" fill="none"
        stroke="url(#lock)" stroke-width="14" stroke-linecap="round"/>

  <!-- body -->
  <rect x="72" y="106" width="112" height="90" rx="13" fill="url(#lock)"/>

  <!-- keyhole -->
  <circle cx="128" cy="142" r="11" fill="#14100A"/>
  <rect x="122" y="146" width="12" height="28" rx="5" fill="#14100A"/>

  <!-- completion bead -->
  <circle cx="180" cy="180" r="6" fill="#66B366"/>
</svg>
